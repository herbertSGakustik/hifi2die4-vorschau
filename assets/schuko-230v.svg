<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Schuko-Steckdose, 230 Volt, 50 Hertz" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="480" height="300" fill="#f3f6f9"/>
  <!-- Rahmen der Steckdose -->
  <rect x="70" y="40" width="220" height="220" rx="34" fill="#ffffff" stroke="#c9d2dc" stroke-width="3"/>
  <circle cx="180" cy="150" r="82" fill="#eef3f8" stroke="#c9d2dc" stroke-width="3"/>
  <circle cx="180" cy="150" r="68" fill="#ffffff" stroke="#dfe5ec" stroke-width="2"/>
  <!-- Schutzkontakte oben und unten -->
  <rect x="166" y="70" width="28" height="12" rx="3" fill="#9aa6b2"/>
  <rect x="166" y="218" width="28" height="12" rx="3" fill="#9aa6b2"/>
  <!-- Kontaktbuchsen -->
  <circle cx="150" cy="150" r="10" fill="#1c2733"/>
  <circle cx="210" cy="150" r="10" fill="#1c2733"/>
  <!-- Beschriftung -->
  <text x="320" y="138" font-family="Nunito, 'Segoe UI', sans-serif" font-weight="800" font-size="52" fill="#1c2733">230 V</text>
  <text x="322" y="172" font-family="'Nunito Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="20" letter-spacing="2" fill="#1f72b8">~ 50 Hz</text>
  <text x="322" y="200" font-family="'Nunito Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="15" letter-spacing="1.5" fill="#5c6b7a">SCHUKO · CEE 7/4</text>
</svg>
